<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdVibe Studio (AdVibe Studios Global) — AI Video Production &amp; Marketing Agency</title>
    <meta name="description" content="Official portal of AdVibe, AdVibe Studio, AdVibe Studios, and AdVibe Studios Global. AI video generation, commercial video production, and performance marketing agency." />
    <link rel="canonical" href="https://advibestudio.github.io/portal/" />
    <script>
      (function () {
        var path = window.location.pathname || '';
        var stripped = path.replace(/^\/portal\/?/i, '');
        var q = window.location.search || '';
        if (stripped && stripped !== '404.html') {
          window.location.replace('/portal/#/' + stripped.replace(/\/+$/, '') + q);
        } else {
          window.location.replace('/portal/' + q);
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="https://advibestudio.github.io/portal/">AdVibe Studio (AdVibe Studios Global)</a>…</p>
  </body>
