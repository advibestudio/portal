    <script>
      (function () {
        // Self-healing function that clears any outdated Service Worker precache and reloads cleanly
        window.__advibeResetAndReload = function () {
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }).then(function () {
                if ('caches' in window) {
                  return caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                  });
                }
              }).finally(function () {
                window.location.reload();
              });
              return;
            }
          } catch (e) {}
          window.location.reload();
        };

        // One-time cleanup of legacy broken root-scoped service worker caches (v1 -> v2)
        try {
          var swFixed = localStorage.getItem('advibe.sw.v2.fixed');
          if (!swFixed && 'serviceWorker' in navigator) {
            localStorage.setItem('advibe.sw.v2.fixed', '1');
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.update(); });
            });
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) {
                  if (k.indexOf('workbox-precache') !== -1) caches.delete(k);
                });
              });
            }
          }
        } catch (e) {}

        // Auto-recover if a lazy-loaded Vite chunk fails after a new deployment
        window.addEventListener('vite:preloadError', function () {
          try {
            var reloaded = sessionStorage.getItem('advibe.chunk.reloaded');
            if (!reloaded) {
              sessionStorage.setItem('advibe.chunk.reloaded', '1');
              window.__advibeResetAndReload();
            }
          } catch (e) {}
        });

        try {
          var raw = localStorage.getItem('advibe.content.cache.v1') || localStorage.getItem('advibe.content.v1');
          var c = raw ? JSON.parse(raw) : null;
          if (c && c.hero && c.hero.headline) document.getElementById('boot-h').textContent = c.hero.headline;
          if (c && c.brand && c.brand.name) document.getElementById('boot-b').textContent = c.brand.name;
        } catch (e) {}
        setTimeout(function () { var n = document.getElementById('boot-slow'); if (n) n.style.display = 'block'; }, 8000);
      })();
    </script>
